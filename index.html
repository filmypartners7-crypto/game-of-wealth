<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth">
<meta name="description" content="Game of Wealth - a turn-based strategy card and economy game for 2 to 6 players.">
<title>Game of Wealth</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#d4af37; --gold-l:#f7e08a; --gold-d:#8a6d1f;
  --green:#0e3b2e; --green2:#0a2a21; --green3:#123f31;
  --bg:#050807; --panel:#0b1210; --panel2:#101a16;
  --line:#22302a; --ink:#ece7d9; --dim:#8d9a92;
  --red:#c0392b; --good:#4ade80; --bad:#ef4444;
  --r:14px;
}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #12362a 0%, transparent 55%),
    radial-gradient(80% 60% at 100% 100%, #1a2c1f 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;
}
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.dim{color:var(--dim)}

/* ---------- buttons ---------- */
.btn{
  padding:13px 16px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(180deg,#16241e,#0e1714);color:var(--ink);
  font-weight:700;font-size:15px;min-height:48px;
  transition:transform .08s ease,filter .15s ease,border-color .15s;
}
.btn:active{transform:scale(.975)}
.btn.primary{
  background:linear-gradient(180deg,#e7c65a,#b8912a);color:#161203;border-color:#f0d98b;
  box-shadow:0 6px 22px -8px rgba(212,175,55,.65);
}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
.btn.danger{color:#ffb4ac;border-color:#4a2320}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* ---------- menu ---------- */
#menuScreen{padding:28px 18px 34px;justify-content:center;gap:18px}
.brand{text-align:center;padding:8px 0 2px}
.brand-mark{font-size:30px;color:var(--gold);filter:drop-shadow(0 0 14px rgba(212,175,55,.5))}
.brand h1{font-size:30px;line-height:1.05;letter-spacing:.12em;font-weight:800}
.brand h1 span{
  background:linear-gradient(180deg,#f8e79c,#c9a227 60%,#8a6d1f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .tag{color:var(--dim);font-size:13px;margin:8px 0 0;letter-spacing:.06em;text-transform:uppercase}
.panel{
  background:linear-gradient(180deg,rgba(18,32,26,.92),rgba(9,15,12,.92));
  border:1px solid var(--line);border-radius:18px;padding:16px;
  box-shadow:0 24px 60px -30px #000 inset,0 10px 40px -24px #000;
  display:flex;flex-direction:column;gap:14px;
}
.seg{display:flex;background:#0a120f;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 8px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:linear-gradient(180deg,#1d332a,#12211b);color:var(--gold-l);box-shadow:0 0 0 1px rgba(212,175,55,.35) inset}
.seg.small button{font-size:12.5px;padding:9px 4px}
.row{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--dim)}
.row>span{min-width:88px}
.row b{color:var(--gold-l);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row input[type=range]{flex:1}
.row .seg{flex:1}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:30px;background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#3b2f11,#1a2b22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-9px;background:radial-gradient(circle at 35% 30%,#ffe89a,#c9a227 70%);border:1px solid #f0d98b;box-shadow:0 0 12px rgba(212,175,55,.55)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#1a2b22}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:1px solid #f0d98b;border-radius:50%;background:#c9a227}

/* ---------- game ---------- */
#gameScreen{padding:0 10px 10px;gap:8px}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 2px 4px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(5,8,7,.96),rgba(5,8,7,.75) 70%,transparent)}
.topbar .meta{flex:1;text-align:center;min-width:0}
.topbar .icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#0d1714;font-size:17px;color:var(--dim);display:grid;place-items:center}
#roundLabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.phase{font-size:15px;font-weight:800;color:var(--gold-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase.p-bid{color:#9fe8c4}.phase.p-select{color:#9fe8c4}.phase.p-payout{color:#ffd166}
.phase.p-gameEnd{color:#ffd166}

.goldbar{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#101b16,#0a1210);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.goldprice{display:flex;align-items:baseline;gap:7px;flex-shrink:0}
.goldprice .lbl{font-size:10px;letter-spacing:.14em;color:var(--gold-d)}
.goldprice b{font-size:20px;color:var(--gold-l);font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--dim)}
#goldChart{flex:1;height:44px;min-width:60px}

.seats{display:grid;gap:7px}
.seats.n2,.seats.n3,.seats.n4{grid-template-columns:1fr 1fr}
.seats.n5,.seats.n6{grid-template-columns:1fr 1fr 1fr}
.seat{
  position:relative;background:linear-gradient(180deg,#0f1a15,#0a1310);
  border:1px solid var(--line);border-radius:12px;padding:8px 9px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.seat.active{border-color:rgba(212,175,55,.75);box-shadow:0 0 0 1px rgba(212,175,55,.35) inset,0 0 22px -8px rgba(212,175,55,.6)}
.seat.out{opacity:.42;filter:grayscale(.6)}
.seat-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sname{font-size:12px;font-weight:700;color:#cfd8d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname .you{font-style:normal;font-size:9px;color:#0f1a15;background:var(--gold);padding:1px 5px;border-radius:5px;margin-left:4px;font-weight:800}
.shand{font-size:10.5px;color:var(--dim)}
.smoney{font-size:17px;font-weight:800;color:var(--gold-l);font-variant-numeric:tabular-nums;margin-top:2px}
.sgold{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:4px}
.gold-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(180deg,#ffe89a,#b8912a);display:inline-block}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font-size:9.5px;padding:2px 6px;border-radius:6px;background:#16241e;border:1px solid var(--line);color:var(--dim)}
.badge.bid{color:#0f1a15;background:var(--gold);border-color:#f0d98b;font-weight:800}
.badge.debt{color:#ffc9c2;border-color:#4a2320}
.badge.dead{color:#ffb4ac;border-color:#4a2320}
.mini{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap}
.mcard{font-size:10px;font-weight:800;background:#132019;border:1px solid #263a30;border-radius:4px;padding:1px 4px;color:var(--gold-l)}
.mcard i{font-style:normal;color:var(--dim);margin-left:1px}

.tablemid{display:flex;align-items:center;gap:8px}
.pile{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#0e1a15,#091310)}
.pile.empty{opacity:.4}
.pile-num{font-size:16px;font-weight:800;color:var(--gold-l);font-variant-numeric:tabular-nums}
.pile-lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.bankbox{flex:1.1;text-align:center;border-radius:12px;border:1px dashed #2b3d33;padding:8px 4px;background:#0a1310}
.bankbox .lbl{display:block;font-size:9.5px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.bankbox b{font-size:14px;color:#bfe8cf;font-variant-numeric:tabular-nums}

.handwrap{background:linear-gradient(180deg,rgba(14,26,21,.7),rgba(7,12,10,.7));border:1px solid var(--line);border-radius:var(--r);padding:7px 9px 9px}
.handhead{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.hand{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.card{
  flex:0 0 auto;width:48px;height:68px;border-radius:9px;position:relative;
  background:linear-gradient(165deg,#1a2620,#0c1512);border:1px solid #2c4034;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--gold-l);font-weight:800;transition:transform .15s,box-shadow .15s,border-color .15s;
}
.card .r{font-size:19px;line-height:1}
.card .s{font-size:14px;line-height:1;margin-top:1px}
.card .pv{position:absolute;bottom:3px;font-size:8px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.card.red{color:#ff9c8f}
.card.pickable{cursor:pointer}
.card.pickable:active{transform:translateY(-3px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.5),0 8px 20px -10px rgba(212,175,55,.8);transform:translateY(-5px)}
.card.backmask{background:repeating-linear-gradient(45deg,#101d17,#101d17 5px,#0c1512 5px,#0c1512 10px);border-color:#233529;opacity:.7}

.bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.actionbar{padding:8px 2px 4px;display:flex;flex-direction:column;gap:8px;min-height:96px;justify-content:flex-end}
.hint{font-size:12.5px;color:var(--dim);text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.bidrow{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.bidrow b{font-size:19px;color:var(--gold-l);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px}
.quick button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#0e1a15;font-size:12.5px;font-weight:700;color:var(--dim)}
.quick button:active{background:#16241e;color:var(--gold-l)}

/* ---------- overlay / sheet ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(2,4,3,.72);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .18s ease;padding:0;
}
.overlay.in{opacity:1}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#122019,#080e0b 40%);
  border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  transform:translateY(22px);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -20px 60px -20px #000;padding-bottom:env(safe-area-inset-bottom);
}
.overlay.in .sheet{transform:translateY(0)}
.sh-head{padding:16px 18px 12px;font-size:16px;font-weight:800;color:var(--gold-l);display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
.sh-price{font-size:12px;color:var(--dim);font-weight:600}
.sh-body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sh-foot{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}
.lead{font-size:13.5px;color:#c3ccc6;margin:0}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:5px 0;border-bottom:1px dashed #1b2822}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.kv.total{border-bottom:0;padding-top:10px;font-size:14px}
.kv.total b{color:var(--gold-l);font-size:17px}
.warn{font-size:11.5px;color:#e0b25c;background:#1d1708;border:1px solid #3b2f11;border-radius:9px;padding:8px 10px}

.sh-tabs{display:flex;gap:6px;padding:10px 18px 0}
.tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#0b1512;font-size:13px;font-weight:700;color:var(--dim)}
.tab.on{background:linear-gradient(180deg,#1d332a,#12211b);color:var(--gold-l);border-color:rgba(212,175,55,.4)}
.qtyrow{display:flex;align-items:center;gap:8px}
.qtyrow input{flex:1}
.stepbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#101d17;font-size:18px;color:var(--gold-l)}
.bigqty{text-align:center;font-size:26px;font-weight:800;color:var(--gold-l);font-variant-numeric:tabular-nums}
.bigqty small{font-size:12px;color:var(--dim);font-weight:600}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.dcard{
  position:relative;height:72px;border-radius:9px;border:1px solid #2c4034;
  background:linear-gradient(165deg,#1a2620,#0c1512);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--gold-l);font-weight:800;opacity:.45;
}
.dcard .r{font-size:18px;line-height:1}
.dcard .s{font-size:13px;line-height:1}
.dcard .pv{position:absolute;bottom:3px;font-size:8.5px;color:var(--dim);font-weight:600}
.dcard.red{color:#ff9c8f}
.dcard.buyable{opacity:1;border-color:rgba(212,175,55,.5);box-shadow:0 0 0 1px rgba(212,175,55,.15) inset}
.dcard.buyable:active{transform:scale(.95)}
.empty-note{color:var(--dim);font-size:13px;text-align:center;padding:18px 6px}

.lenders{display:flex;gap:7px;flex-wrap:wrap}
.lender{flex:1 1 44%;min-width:44%;display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:11px;border:1px solid var(--line);background:#0b1512;text-align:left}
.lender b{font-size:13px;color:var(--ink)}
.lender span{font-size:10.5px;color:var(--dim)}
.lender.on{border-color:rgba(212,175,55,.6);background:linear-gradient(180deg,#1d332a,#12211b)}
.lender:disabled{opacity:.35}

/* reveal */
.rgrid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rcell{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:62px;opacity:.85}
.rcell.win{opacity:1}
.rcell.cancelled{opacity:.5}
.rname{font-size:11px;color:var(--dim);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbid{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.rtag{font-size:9px;letter-spacing:.06em;color:var(--gold-l);height:12px;text-transform:uppercase;font-weight:800}
.rcell.cancelled .rtag{color:#ff9c8f}
.rcard{width:56px;height:80px;perspective:600px}
.rcard .rin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.rcard.go .rin{transform:rotateY(0)}
.rcard .face{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.rcard .face.front{background:linear-gradient(165deg,#1e2b24,#0d1713);border:1px solid #33493c;color:var(--gold-l)}
.rcard.red .face.front{color:#ff9c8f}
.rcard .face.front .r{font-size:22px;line-height:1}
.rcard .face.front .s{font-size:15px;line-height:1}
.rcard .face.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#14241d,#14241d 5px,#0d1a15 5px,#0d1a15 10px);border:1px solid #2b4438}
.rcell.win .rcard .face.front{box-shadow:0 0 0 2px var(--gold),0 0 26px -6px rgba(212,175,55,.9)}
.payline{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:4px 0}
.payline b{color:var(--ink);font-variant-numeric:tabular-nums}
.payline.total{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-size:14px}
.payline.total b{color:var(--gold-l);font-size:17px}

/* standings */
.standlist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.stand{display:grid;grid-template-columns:22px 1fr auto auto;gap:9px;align-items:center;font-size:13px;padding:8px 10px;border-radius:10px;background:#0c1613;border:1px solid var(--line)}
.stand .pos{color:var(--gold-d);font-weight:800;font-size:12px}
.stand .nm{color:#cfd8d2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand .cs{color:var(--gold-l);font-weight:700;font-variant-numeric:tabular-nums}
.stand .gd{color:var(--dim);font-size:11px;min-width:52px;text-align:right}
.stand.first{border-color:rgba(212,175,55,.55);background:linear-gradient(90deg,#1b2a22,#0c1613)}
.stand.elim{opacity:.45}
.champ{text-align:center;padding:6px 0 10px}
.champ .crown{font-size:30px;color:var(--gold)}
.champ .cname{font-size:20px;font-weight:800;color:var(--gold-l);margin-top:2px}
.champ .ccash{font-size:15px;color:#bfe8cf;font-variant-numeric:tabular-nums}
.champ .cnet{font-size:11.5px;color:var(--dim)}

/* gate */
.gate-sheet{text-align:center}
.gate{padding:30px 22px 26px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate-icon{font-size:34px;color:var(--gold);filter:drop-shadow(0 0 16px rgba(212,175,55,.6))}
.gate h3{font-size:20px;color:var(--gold-l)}
.gate p{color:var(--dim);font-size:14px;margin:0 0 8px}

/* rules */
.rules h4{color:var(--gold-l);font-size:13.5px;margin:12px 0 4px;letter-spacing:.03em}
.rules h4:first-child{margin-top:0}
.rules p{margin:0;font-size:13px;color:#c3ccc6;line-height:1.55}
.menu{display:flex;flex-direction:column;gap:8px}
.loglist{max-height:60dvh;gap:0}
.logline{font-size:12.5px;color:#c3ccc6;padding:7px 0;border-bottom:1px solid #16211c;display:flex;gap:8px;line-height:1.4}
.logline .lr{color:var(--gold-d);font-size:10.5px;flex:0 0 24px;padding-top:2px}
.logline.k-gold{color:#e8d69a}
.logline.k-win{color:#a9f0c4}
.logline.k-bad{color:#ffb4ac}
.logline.k-tie{color:#d8c9a0}
.logline.k-loan{color:#a8c8ff}
.logline.k-round{color:#9fe8c4}

@media (min-width:520px){
  .card{width:54px;height:76px}
  .rcard{width:64px;height:92px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* safe areas */
#app{padding-top:env(safe-area-inset-top)}

.topbar .logbtn{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gold-d)}
#gameScreen::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 34% at 50% 62%,rgba(20,58,44,.55),transparent 70%);z-index:-1}

.felt{flex:1;min-height:54px;display:grid;place-items:center;padding:6px 0;overflow:hidden}
.felt-in{
  width:92%;max-width:440px;height:100%;min-height:64px;
  border-radius:50% / 46%;border:1px solid rgba(212,175,55,.16);
  background:radial-gradient(ellipse at 50% 35%,rgba(24,70,52,.6),rgba(8,16,12,.15) 72%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.65);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
