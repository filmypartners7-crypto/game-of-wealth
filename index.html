  function showRules() {
    openSheet(
      '<div class="sh-head">How to play</div>' +
      '<div class="sh-body rules">' +
      '<h4>The table</h4><p>2\u20136 players. Everyone starts with cash and 5 cards from a shuffled 52-card deck. 2 is low, Ace is high. Suits mean nothing.</p>' +
      '<h4>Gold</h4><p>Opens at \u20B91,000 a biscuit, moves between \u20B91,000 and \u20B95,000 at the start of every round. Trade only at round start.</p>' +
      '<h4>A round</h4><p>New gold price \u2192 buy/sell gold \u2192 buy cards from the Cards Space \u2192 loans come due. Then the matches are played.</p>' +
      '<h4>A match</h4><p>Everyone locks a bid of at least \u20B9100, hidden until all are in. Hands are revealed, then hidden. Everyone plays one card face down. Highest rank wins. Ties at the top are cancelled and the next rank wins. If everyone ties, bids come back.</p>' +
      '<h4>Payout</h4><p>The winner takes every opponent\u2019s bid, plus half their own bid from the bank if they bid above \u20B9100. Played cards go to the Cards Space.</p>' +
      '<h4>Buying cards</h4><p>J \u20B9300, Q \u20B9500, K \u20B9700, A \u20B91,000; number cards \u20B950\u2013\u20B9250. Hand limit 7.</p>' +
      '<h4>Loans</h4><p>Under \u20B9100 you can\u2019t bid. Borrow from the bank (up to \u20B92,000) or a player who agrees. Repay at the next round start or you\u2019re out.</p>' +
      '<h4>Game end</h4><p>When the draw deck empties, everyone sells gold at the closing price. Highest cash wins.</p>' +
      '</div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="ruClose">Got it</button></div>', 'rules-sheet', 'rules');
    $('ruClose').onclick = closeSheet;
  }

  function showLog() {
    const items = S.log.slice(0, 120).map(function (l) {
      return '<div class="logline k-' + l.kind + '"><span class="lr">R' + l.round + '</span>' + esc(l.text) + '</div>';
    }).join('');
    openSheet('<div class="sh-head">Action log</div><div class="sh-body loglist">' +
      (items || '<div class="empty-note">Nothing yet.</div>') + '</div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="lgClose">Close</button></div>', 'log-sheet', 'log');
    $('lgClose').onclick = closeSheet;
  }

  function showDiscard() {
    const s = S;
    const vid = viewerId();
    const p = vid ? E.byId(s, vid) : null;
    const canBuy = !!(p && !p.isBot && s.step === 'cards' && s.actor === p.id);
    const cards = s.discard.slice().sort(function (a, b) { return b.r - a.r || a.s - b.s; });
    openSheet(
      '<div class="sh-head">Cards Space <span class="sh-price">' + cards.length + ' cards</span></div>' +
      '<div class="sh-body">' +
      (cards.length ? '<div class="dstrip" style="flex-wrap:wrap;overflow:visible;min-height:0">' + cards.map(function (c) {
        const price = E.priceOf(c);
        const ok = canBuy && p.cash >= price && p.hand.length < E.HAND_LIMIT;
        return '<button class="dmini' + (ok ? ' buyable' : '') + ((c.s === 1 || c.s === 2) ? ' red' : '') +
          '" data-b="' + c.id + '"' + (ok ? '' : ' disabled') + ' style="width:52px;height:68px">' +
          '<span class="r">' + E.RANK_LABEL[c.r] + '</span><span class="s">' + E.SUITS[c.s] + '</span>' +
          '<span class="pv">' + fmt(price) + '</span></button>';
      }).join('') + '</div>' : '<div class="empty-note">Played cards land here.</div>') +
      '</div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="dsClose">Close</button></div>', 'discard-sheet', 'discard');
    $('dsClose').onclick = closeSheet;
    document.querySelectorAll('.discard-sheet [data-b]').forEach(function (b) {
      b.onclick = function () {
        if (!canBuy) return;
        if (E.buyDiscardCard(s, p.id, b.dataset.b)) { closeSheet(); UI.panelKey = null; render(); }
      };
    });
  }

  function showGameMenu() {
    openSheet(
      '<div class="sh-head">Menu</div>' +
      '<div class="sh-body menu">' +
      '<button class="btn wide" id="mRules">Rules</button>' +
      '<button class="btn wide" id="mLog">Action log</button>' +
      '<button class="btn wide" id="mSave">Save &amp; exit to menu</button>' +
      '<button class="btn wide danger" id="mNew">Abandon &amp; start over</button>' +
      '</div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="mClose">Back to the table</button></div>', 'menu-sheet', 'menu');
    $('mRules').onclick = showRules;
    $('mLog').onclick = showLog;
    $('mSave').onclick = function () { UI.saved = S; closeSheet(); S = null; goHome(); };
    $('mNew').onclick = function () {
      if (confirm('Abandon this game and return home?')) { S = null; closeSheet(); goHome(); }
    };
    $('mClose').onclick = closeSheet;
  }

  /* ---------------- menu wiring ---------------- */
  function refreshMenu() {
    $('btnContinue').hidden = !UI.saved;
    $('btnContinue').textContent = UI.saved ? 'Resume saved game' : '';
    $('botRow').style.display = UI.mode === 'bots' ? '' : 'none';
    $('cfgPlayersVal').textContent = UI.players;
    $('cfgPlayers').value = UI.players;
    $('cfgCashVal').textContent = UI.cash.toLocaleString('en-IN');
    $('cfgCash').value = UI.cash;
  }

  function bindMenu() {
    document.querySelectorAll('#modeSeg button').forEach(function (b) {
      b.onclick = function () {
        UI.mode = b.dataset.mode;
        document.querySelectorAll('#modeSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        refreshMenu();
      };
    });
    document.querySelectorAll('#diffSeg button').forEach(function (b) {
      b.onclick = function () {
        UI.diff = b.dataset.diff;
        document.querySelectorAll('#diffSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      };
    });
    $('cfgPlayers').oninput = function () { UI.players = +this.value; refreshMenu(); };
    $('cfgCash').oninput = function () { UI.cash = +this.value; refreshMenu(); };
    $('btnStart').onclick = startGame;
    $('btnContinue').onclick = function () {
      if (!UI.saved) return;
      S = UI.saved; UI.saved = null;
      resetTurnUI();
      showScreen('game'); render();
    };
    $('btnRules').onclick = showRules;
  }

  function bindBoard() {
    $('btnMenu').onclick = showGameMenu;
    $('deckPile').onclick = function () {
      openSheet('<div class="sh-head">Draw deck</div><div class="sh-body"><p class="lead">' + S.deck.length +
        ' cards left. When it hits zero the game is over.</p></div>' +
        '<div class="sh-foot"><button class="btn primary wide" id="dkC">Close</button></div>', 'log-sheet', 'deck');
      $('dkC').onclick = closeSheet;
    };
    $('discardPile').onclick = showDiscard;

    $('hand').addEventListener('click', function (ev) {
      const btn = ev.target.closest('[data-card]');
      if (!btn) return;
      const s = S;
      const vid = viewerId();
      const p = vid ? E.byId(s, vid) : null;
      if (!p || p.isBot || s.phase !== 'select' || s.actor !== p.id) return;
      const id = btn.dataset.card;
      if (UI.selected === id) {                       // tap again = confirm
        UI.selected = null;
        if (E.playCard(S, p.id, id)) { UI.panelKey = null; render(); }
        return;
      }
      UI.selected = id;                                // tap once = lift
      renderHand();
      UI.panelKey = null;
      renderPanel();
    });

    document.querySelectorAll('#bottomnav button').forEach(function (b) {
      b.onclick = function () {
        if (!S) return;
        const n = b.dataset.nav;
        if (n === 'leaderboard') showLeaderboard();
        else if (n === 'profile') showProfile();
        else showShop();
      };
    });

    $('overlay').addEventListener('click', function (ev) {
      if (ev.target !== $('overlay')) return;
      const keep = ['gate', 'reveal', 'hands', 'round', 'results', 'price'];
      if (keep.indexOf(UI.sheetKind) >= 0) return;
      closeSheet();
    });
  }

  function boot() {
    bindMenu();
    bindBoard();
    bindHome();
    refreshMenu();
    showScreen('splash');
    spawnFloaties();
    runLoader();
  }

  function runLoader() {
    const fill = $('loadFill'), pct = $('loadPct'), acts = $('splashActions');
    if (!fill) return;
    const t0 = performance.now(), dur = 2000;
    function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      fill.style.width = (p * 100) + '%';
      pct.textContent = Math.round(p * 100) + '%';
      if (p < 1) requestAnimationFrame(step);
      else if (acts) acts.classList.add('show');
    }
    requestAnimationFrame(step);
  }

  function spawnFloaties() {
    const wrap = $('floaties');
    if (!wrap) return;
    wrap.innerHTML = '';
    const kinds = ['assets/ic-cash1.webp', 'assets/ic-gold1.webp'];
    for (let i = 0; i < 8; i++) {
      const img = document.createElement('img');
      img.className = 'flimg';
      img.src = kinds[i % 2];
      img.alt = '';
      const isNote = (i % 2 === 0);
      const size = (isNote ? 40 : 30) + Math.random() * 22;
      const dur = 6 + Math.random() * 6;
      const r0 = isNote ? (Math.random() * 16 - 8) : (Math.random() * 80 - 40);
      const r1 = isNote ? (r0 + (Math.random() * 36 - 18)) : (r0 + Math.random() * 260 + 120);
      img.style.width = size + 'px';
      img.style.left = (Math.random() * 86) + '%';
      img.style.animationDuration = dur + 's';
      img.style.animationDelay = (-Math.random() * dur) + 's';
      img.style.setProperty('--r0', r0.toFixed(1) + 'deg');
      img.style.setProperty('--r1', r1.toFixed(1) + 'deg');
      img.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
      img.style.opacity = (0.85 + Math.random() * 0.15).toFixed(2);
      wrap.appendChild(img);
    }
  }

  function bindHome() {
    ['btnGuest', 'btnGoogle', 'btnPhone'].forEach(function (id) {
      const el = $(id);
      if (!el) return;
      el.onclick = function () { goHome(); };
    });
    $('btnPlay').onclick = function () { UI.mode = 'bots'; syncModeSeg(); openSetup(); };
    document.querySelectorAll('.mode[data-mode]').forEach(function (b) {
      b.onclick = function () { UI.mode = b.dataset.mode; syncModeSeg(); openSetup(); };
    });
    $('btnPrivate').onclick = function () {
      openSheet('<div class="sh-head">Private Room</div><div class="sh-body"><p class="lead">Private rooms need online play, which isn\u2019t built yet \u2014 the engine is ready for it, the server isn\u2019t.</p><div class="warn">Play vs Bots or Pass &amp; Play for now.</div></div><div class="sh-foot"><button class="btn primary wide" id="prvC">Got it</button></div>', 'log-sheet', 'generic');
      $('prvC').onclick = closeSheet;
    };
    $('btnGift').onclick = function () {
      openSheet('<div class="sh-head">Daily gift</div><div class="sh-body"><p class="lead">One gift a day, once rewards exist. Right now the game economy is cash and gold at the table only.</p></div><div class="sh-foot"><button class="btn primary wide" id="gftC">Close</button></div>', 'log-sheet', 'generic');
      $('gftC').onclick = closeSheet;
    };
    $('btnMissions').onclick = function () {
      openSheet('<div class="sh-head">Missions</div><div class="sh-body"><p class="lead">Missions arrive with the meta layer. For now the only scoreboard is the table itself.</p></div><div class="sh-foot"><button class="btn primary wide" id="msC">Close</button></div>', 'log-sheet', 'generic');
      $('msC').onclick = closeSheet;
    };
    document.querySelectorAll('.homenav button').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('.homenav button').forEach(function (x) { x.classList.toggle('on', x === b); });
        const n = b.dataset.hnav;
        if (n === 'home') return;
        if (n === 'shop') return showShop();
        if (n === 'rules') return showRules();
        if (n === 'profile') return showHomeProfile();
        if (n === 'leaderboard') return showHomeLeaderboard();
      };
    });
    $('btnSetupBack').onclick = function () { goHome(); };
    let secs = 23 * 3600 + 45 * 60 + 17;
    setInterval(function () {
      secs = Math.max(0, secs - 1);
      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const ss = String(secs % 60).padStart(2, '0');
      const el = $('giftTimer');
      if (el) el.textContent = h + ':' + m + ':' + ss;
    }, 1000);
  }

  function syncModeSeg() {
    document.querySelectorAll('#modeSeg button').forEach(function (x) {
      x.classList.toggle('on', x.dataset.mode === UI.mode);
    });
    refreshMenu();
  }

  function openSetup() {
    refreshMenu();
    showScreen('menu');
  }

  function showHomeProfile() {
    openSheet(
      '<div class="sh-head">Profile</div>' +
      '<div class="sh-body">' +
      '<div class="kv"><span>Name</span><b>' + esc(PROFILE.name) + '</b></div>' +
      '<div class="kv"><span>Level</span><b>' + PROFILE.level + '</b></div>' +
      '<div class="kv"><span>XP</span><b>' + PROFILE.xp + ' / ' + PROFILE.xpMax + '</b></div>' +
      '<div class="kv"><span>Cash</span><b>' + fmt(PROFILE.cash) + '</b></div>' +
      '<div class="kv"><span>RIX</span><b>' + PROFILE.rix + '</b></div>' +
      '</div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="hpC">Close</button></div>', 'log-sheet', 'generic');
    $('hpC').onclick = closeSheet;
  }

  function showHomeLeaderboard() {
    const rows = [
      { n: 'RajaBhai', v: 12450 },
      { n: 'BiscuitOP', v: 15230 },
      { n: 'PixelRani', v: 11320 },
      { n: 'LegendMithu', v: 9870 },
      { n: PROFILE.name, v: PROFILE.cash }
    ].sort(function (a, b) { return b.v - a.v; });
    openSheet(
      '<div class="sh-head">Leaderboard <span class="sh-price">net worth</span></div>' +
      '<div class="sh-body"><div class="standlist">' + rows.map(function (r, i) {
        return '<div class="stand' + (i === 0 ? ' first' : '') + '"><span class="pos">' + (i + 1) + '</span>' +
          '<span class="nm">' + esc(r.n) + '</span><span class="cs">' + fmt(r.v) + '</span><span class="gd"></span></div>';
      }).join('') + '</div></div>' +
      '<div class="sh-foot"><button class="btn primary wide" id="hlC">Close</button></div>', 'log-sheet', 'generic');
    $('hlC').onclick = closeSheet;
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();

  window.GOW = { get state() { return S; }, UI: UI, Engine: E };
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
